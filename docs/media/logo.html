<!doctype html>
<!-- Source of logo.png and banner.png. Regenerate: open in Chromium and screenshot #logo (transparent) / #banner. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&display=block" rel="stylesheet">
<style>
  body { margin: 0; background: transparent; }
  #logo { width: 1200px; height: 360px; display: flex; align-items: center; justify-content: center; gap: 36px; }
  .words { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .league { font: 800 44px 'Cinzel', serif; letter-spacing: 18px; margin-right: -18px; color: #c8aa6e; display: flex; align-items: center; gap: 22px; }
  .league i { display: block; width: 120px; height: 2px; background: linear-gradient(90deg, transparent, #c8aa6e); }
  .league i:last-child { transform: scaleX(-1); }
  .surv { font: 900 132px 'Cinzel', serif; letter-spacing: 6px; margin-top: 6px;
    background: linear-gradient(180deg, #fff3d0 0%, #f0d48a 38%, #c8aa6e 55%, #785a28 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #2a1d08) drop-shadow(0 0 18px rgba(200,170,110,0.35)); }
  .tag { font: 600 22px 'Cinzel', serif; letter-spacing: 10px; color: #a09b8c; margin-top: 14px; }
  #banner { width: 1600px; height: 520px; position: relative; overflow: hidden; display: grid; place-items: center; background: #010a13; }
  #banner .bg { position: absolute; inset: -20px; background: url(bg.jpg) center/cover; filter: blur(3px) saturate(1.1) brightness(0.42); }
  #banner .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(1,10,19,0.15) 30%, rgba(1,10,19,0.92) 85%); }
  #banner .frame { position: absolute; inset: 14px; border: 2px solid rgba(200,170,110,0.55); outline: 1px solid rgba(200,170,110,0.25); outline-offset: 6px; }
  #banner #logo { position: relative; }
</style>
</head>
<body>
<template id="mark">
  <!-- crest: a blade inside a ring of closing spikes (survive the ring) -->
  <svg width="260" height="300" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff3d0"/><stop offset="0.4" stop-color="#f0d48a"/>
        <stop offset="0.6" stop-color="#c8aa6e"/><stop offset="1" stop-color="#785a28"/>
      </linearGradient>
      <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
        <stop offset="0" stop-color="#2fd2ff" stop-opacity="0.9"/><stop offset="0.45" stop-color="#0a5a8a" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#010a13" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="spike" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d9a7ff"/><stop offset="1" stop-color="#5b2a8c"/>
      </linearGradient>
    </defs>
    <!-- shield -->
    <path d="M130 8 L246 48 L238 168 Q226 240 130 292 Q34 240 22 168 L14 48 Z" fill="#010a13" stroke="url(#g)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M130 26 L228 60 L221 166 Q210 226 130 272 Q50 226 39 166 L32 60 Z" fill="none" stroke="#785a28" stroke-width="2"/>
    <circle cx="130" cy="140" r="78" fill="url(#core)"/>
    <!-- ring of spikes -->
    <g transform="translate(130 140)">
      <circle r="64" fill="none" stroke="#9b59d0" stroke-width="5"/>
      <g fill="url(#spike)">
        <path id="sp" d="M-7 -62 L0 -92 L7 -62 Z"/>
        <use href="#sp" transform="rotate(30)"/><use href="#sp" transform="rotate(60)"/><use href="#sp" transform="rotate(90)"/>
        <use href="#sp" transform="rotate(120)"/><use href="#sp" transform="rotate(150)"/><use href="#sp" transform="rotate(180)"/>
        <use href="#sp" transform="rotate(210)"/><use href="#sp" transform="rotate(240)"/><use href="#sp" transform="rotate(270)"/>
        <use href="#sp" transform="rotate(300)"/><use href="#sp" transform="rotate(330)"/>
      </g>
    </g>
    <!-- blade -->
    <g transform="translate(130 140)">
      <path d="M0 -112 L13 -88 L9 44 L0 58 L-9 44 L-13 -88 Z" fill="url(#g)" stroke="#2a1d08" stroke-width="2"/>
      <path d="M0 -104 L0 50" stroke="#fff3d0" stroke-width="2" opacity="0.7"/>
      <path d="M-44 44 Q0 30 44 44 L40 54 Q0 44 -40 54 Z" fill="url(#g)" stroke="#2a1d08" stroke-width="2"/>
      <rect x="-7" y="54" width="14" height="40" rx="3" fill="#785a28" stroke="#2a1d08" stroke-width="2"/>
      <circle cy="102" r="11" fill="#2fd2ff" stroke="url(#g)" stroke-width="5"/>
    </g>
  </svg>
</template>

<div id="logo-wrap">
  <div id="logo">
    <div class="mark"></div>
    <div class="words">
      <div class="league"><i></i>LEAGUE OF<i></i></div>
      <div class="surv">SURVIVORS</div>
    </div>
  </div>
</div>

<div id="banner">
  <div class="bg"></div><div class="vignette"></div><div class="frame"></div>
  <div id="logo">
    <div class="mark"></div>
    <div class="words">
      <div class="league"><i></i>LEAGUE OF<i></i></div>
      <div class="surv">SURVIVORS</div>
      <div class="tag">SURVIVE · LEVEL UP · SLAY THE BARON</div>
    </div>
  </div>
</div>
<script>
  for (const m of document.querySelectorAll('.mark')) m.append(document.getElementById('mark').content.cloneNode(true));
</script>
</body>
</html>
