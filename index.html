<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>League of Survivors</title>
    <style>
      :root { --gold: #c8aa6e; --gold-dim: #785a28; --panel: rgba(1, 10, 19, 0.85); --text: #f0e6d2; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #010a13; color: var(--text); font: 14px/1.3 system-ui, sans-serif; user-select: none; }
      #app canvas { display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 20px; color: var(--gold); }
      #top { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
      #xp { height: 10px; background: var(--panel); border: 1px solid var(--gold-dim); }
      #xp-fill { height: 100%; width: 0; background: linear-gradient(90deg, #7b4fd6, #b78cff); }
      #top-row { display: flex; justify-content: space-between; font-weight: 600; text-shadow: 0 1px 2px #000; }
      #timer { font-size: 22px; color: var(--gold); }
      #boss { display: none; width: min(560px, 90vw); margin: 4px auto 0; text-align: center; }
      #boss-bar { height: 14px; background: var(--panel); border: 1px solid #a33; }
      #boss-fill { height: 100%; background: linear-gradient(90deg, #8a1c2b, #d43c4f); }
      #bottom { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold-dim); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; min-width: min(420px, 94vw); }
      #lvl-row { display: flex; gap: 10px; align-items: center; }
      #level { width: 32px; height: 32px; border: 2px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--gold); }
      #skills { display: flex; gap: 8px; }
      .skill { position: relative; width: 52px; height: 52px; border: 2px solid var(--gold-dim); overflow: hidden; }
      .skill img { width: 100%; height: 100%; display: block; }
      .skill .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
      .skill .key { position: absolute; left: 2px; bottom: 6px; font-size: 11px; font-weight: 700; text-shadow: 0 0 3px #000; }
      .skill .pips { position: absolute; bottom: 1px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
      .skill .pips i { width: 6px; height: 3px; background: #333; }
      .skill .pips i.on { background: #ffd257; }
      .skill.locked img { filter: grayscale(1) brightness(0.35); }
      .skill.nomana img { filter: hue-rotate(200deg) brightness(0.6); }
      .bar { position: relative; width: 100%; height: 16px; background: #111; border: 1px solid #000; }
      .bar div { height: 100%; }
      .bar span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; text-shadow: 0 1px 1px #000; }
      #hp-fill { background: linear-gradient(#3fbf4a, #1e7d27); }
      #mana-fill { background: linear-gradient(#3d8ee0, #1f5ea8); }
      #stats { font-size: 11px; opacity: 0.85; }
      #auto { font-size: 12px; color: #7fe08a; }
      #auto.off { color: #e07f7f; }
      #help { position: fixed; bottom: 12px; left: 16px; font-size: 11px; opacity: 0.7; max-width: 230px; }
      .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(1,10,19,0.75); }
      .overlay h2 { color: var(--gold); margin: 0; }
      #choices button.skill-choice b { color: #ffd257; }
      #choices span { font-size: 12px; opacity: 0.8; }
      #horde { display: none; text-align: center; font-size: 20px; font-weight: 700; color: #ff6b5a; text-shadow: 0 0 8px #000; }
      #inventory { display: grid; grid-template-columns: repeat(3, 26px); gap: 2px; margin-left: 6px; }
      #inventory img, #inventory span { width: 26px; height: 26px; border: 1px solid var(--gold-dim); display: block; background: #111; }
      #levelup { overflow-y: auto; padding: 24px 16px; justify-content: flex-start; }
      #levelup h2 { margin-top: 12px; }
      #inv-edit { display: flex; gap: 6px; }
      #inv-edit .slot { position: relative; width: 48px; height: 48px; border: 1px solid var(--gold-dim); background: #111; }
      #inv-edit .slot img { width: 100%; height: 100%; display: block; }
      #inv-edit .slot button { position: absolute; top: -8px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; border: 1px solid #a33; background: #300; color: #fcc; font-size: 11px; cursor: pointer; }
      #inv-edit .slot.confirm button { top: auto; bottom: -10px; right: -12px; }
      #shop { display: flex; gap: 16px; align-items: flex-start; justify-content: center; flex-wrap: wrap; width: 100%; }
      #shop-left { display: flex; flex-direction: column; gap: 10px; width: min(480px, 92vw); }
      #combos, #choices { display: flex; flex-direction: column; gap: 10px; }
      #choices .offer { background: var(--panel); border: 1px solid var(--gold-dim); padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
      #choices .offer:hover:not(.disabled) { border-color: var(--gold); }
      #choices .offer.disabled { opacity: 0.45; cursor: default; }
      #choices .offer.picked { opacity: 1; border-color: #4fdc7a; }
      #choices .offer > img { width: 44px; height: 44px; flex: none; }
      #choices .offer div { display: flex; flex-direction: column; gap: 3px; }
      .into { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px 2px 2px; background: #0a1a26; border: 1px solid #2a3a48; color: var(--text); font: inherit; font-size: 11px; cursor: pointer; }
      .chip img { width: 18px; height: 18px; }
      .chip.hot { border-color: #4fdc7a; color: #4fdc7a; }
      .chip:hover { border-color: var(--gold); }
      #tree { width: min(620px, 94vw); background: var(--panel); border: 1px solid var(--gold-dim); padding: 12px; overflow-x: auto; }
      #tree:empty { display: none; }
      .tree-head { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; font-size: 12px; }
      .tree-head b { font-size: 15px; }
      .tree-sum { color: #ffd257; font-weight: 600; }
      /* org-chart tree: connectors drawn with borders */
      ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; }
      ul.tree ul { padding-top: 14px; position: relative; }
      ul.tree li { position: relative; padding: 14px 3px 0; display: flex; flex-direction: column; align-items: center; }
      ul.tree > li { padding-top: 0; }
      ul.tree ul > li::before, ul.tree ul > li::after { content: ''; position: absolute; top: 0; width: 50%; height: 14px; border-top: 1px solid var(--gold-dim); }
      ul.tree ul > li::before { left: 0; } ul.tree ul > li::after { right: 0; border-left: 1px solid var(--gold-dim); }
      ul.tree ul > li:first-child::before, ul.tree ul > li:last-child::after { border-top: none; }
      ul.tree ul > li:only-child::before { display: none; } ul.tree ul > li:only-child::after { border-top: none; }
      ul.tree ul::before { content: ''; position: absolute; top: 0; left: 50%; height: 14px; border-left: 1px solid var(--gold-dim); }
      .node { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 92px; padding: 5px 3px; border: 1px solid #2a3a48; background: #0a141c; text-align: center; font-size: 10px; }
      .node img { width: 34px; height: 34px; }
      .node b { font-size: 11px; line-height: 1.15; }
      .node small { opacity: 0.8; line-height: 1.2; }
      .node em { font-style: normal; font-weight: 700; font-size: 10px; padding: 1px 4px; }
      .node.root { width: 120px; border-color: #ffb347; } .node.root img { width: 44px; height: 44px; }
      .node.owned { border-color: #4fdc7a; } .node.owned em { color: #4fdc7a; }
      .node.offer { border-color: #ffd257; box-shadow: 0 0 10px rgba(255, 210, 87, 0.5); } .node.offer em { color: #ffd257; }
      .node.missing { border-style: dashed; border-color: #a33; } .node.missing img { filter: grayscale(1) brightness(0.6); } .node.missing em { color: #ff8a7a; }
      .node.partial em { color: #c9a0ff; }
      #restart, #continue { background: var(--panel); color: var(--text); border: 1px solid var(--gold-dim); padding: 10px 12px; text-align: left; cursor: pointer; font: inherit; display: flex; gap: 10px; align-items: flex-start; }
      #choices button.skill-choice { background: var(--panel); color: var(--text); border: 1px solid var(--gold-dim); padding: 10px 12px; text-align: left; cursor: pointer; font: inherit; display: flex; gap: 10px; align-items: flex-start; }
      #choices button.skill-choice > img { width: 44px; height: 44px; flex: none; }
      #choices button.skill-choice div { display: flex; flex-direction: column; gap: 3px; }
      #choices button.skill-choice:hover, #restart:hover, #continue:hover { border-color: var(--gold); }
      #combos .combo { background: var(--panel); border: 1px solid #ffd257; box-shadow: 0 0 12px rgba(255, 210, 87, 0.35); padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
      #combos .combo:hover { box-shadow: 0 0 18px rgba(255, 210, 87, 0.7); }
      #combos .combo > img { width: 44px; height: 44px; flex: none; }
      #combos .combo div { display: flex; flex-direction: column; gap: 3px; }
      #combos .recipe { font-size: 12px; color: #ffd257; font-weight: 600; }
      #continue { justify-content: center; }
      .tier-legendary { color: #ffb347; } .tier-epic { color: #c9a0ff; } .tier-basic { color: var(--text); }
      .passive { color: #9fd8ff; }
      .warn { color: #ff8a7a; }
      .warn.ok { color: #7dffa0; }
      #end-items { display: flex; gap: 4px; } #end-items img { width: 40px; height: 40px; }
      #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .floater { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 15px; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; }
      .floater.physical { color: #ffffff; }
      .floater.magic { color: #6fb6ff; }
      .floater.crit { color: #ffb020; font-size: 20px; }
      .floater.taken { color: #ff4a4a; font-size: 17px; }
      .floater.xp { color: #c49bff; font-size: 13px; }
      #combine { display: none; background: #3a2a05; color: #ffd257; border: 1px solid #ffd257; padding: 4px 10px; font: inherit; font-weight: 700; cursor: pointer; animation: pulse 1.2s ease-in-out infinite alternate; }
      @keyframes pulse { from { box-shadow: 0 0 2px rgba(255, 210, 87, 0.3); } to { box-shadow: 0 0 12px rgba(255, 210, 87, 0.8); } }
      @media (prefers-reduced-motion: reduce) { #combine { animation: none; } }
      @media (max-width: 700px) { #help { display: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="floaters"></div>
    <div id="loading">Carregando…</div>
    <div id="top">
      <div id="xp"><div id="xp-fill"></div></div>
      <div id="top-row"><span id="kills"></span><span id="timer"></span><span id="auto"></span></div>
      <div id="horde"></div>
      <div id="boss"><div id="boss-name"></div><div id="boss-bar"><div id="boss-fill"></div></div></div>
    </div>
    <div id="bottom">
      <div id="lvl-row"><div id="level">1</div><div id="skills"></div><div id="inventory"></div></div>
      <button id="combine">Combinar itens (C)</button>
      <div class="bar"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div class="bar"><div id="mana-fill"></div><span id="mana-text"></span></div>
      <div id="stats"></div>
    </div>
    <div id="help">
      Botão direito no chão: mover (segure para seguir) · Setas: mover<br />
      Botão direito no inimigo: focar alvo · T: ataque automático<br />
      Ataque manual (auto desligado): botão esquerdo no inimigo<br />
      Level-up: 1–4 escolhem a opção · C: combinar itens<br />
      Q W E R: habilidades na direção do cursor
    </div>
    <div id="levelup" class="overlay">
      <h2 id="levelup-title"></h2>
      <div id="inv-edit"></div>
      <div id="shop">
        <div id="shop-left">
          <div id="combos"></div>
          <div id="choices"></div>
          <button id="continue">Continuar</button>
        </div>
        <div id="tree"></div>
      </div>
    </div>
    <div id="end" class="overlay"><h2 id="end-title"></h2><div id="end-stats"></div><div id="end-items"></div><button id="restart">Jogar novamente</button></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
