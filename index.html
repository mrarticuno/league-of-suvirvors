<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>League of Survivors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" />
    <style>
      :root {
        --gold: #d9b56a; --gold-hi: #f6e2a6; --gold-dim: #6e5830; --panel: rgba(10, 17, 32, 0.92); --ink: #04060b;
        --text: #ede6d6; --muted: #a2abbd; --line: #243049; --danger: #ff5a4e; --crit: #ffb020; --xp: #b08cff; --tc: var(--gold);
        --display: 'Cinzel', 'Noto Serif SC', serif; --ui: 'Chakra Petch', system-ui, sans-serif;
        --slot: 64px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font: 600 14px/1.3 var(--ui); user-select: none; }
      button { font: inherit; color: inherit; }
      button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .display { font-family: var(--display); }
      #app canvas { display: block; transition: filter 1.4s ease; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 20px var(--display); color: var(--gold); }

      /* ---------- shared pieces: chamfered gold frame, bars, buttons ---------- */
      .frame { --c: 10px; padding: 1px; background: linear-gradient(180deg, var(--gold-hi), var(--gold-dim) 45%, var(--gold));
        clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
      .frame > .in { height: 100%; background: linear-gradient(180deg, rgba(18, 27, 44, 0.95), rgba(6, 10, 18, 0.95));
        clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
      .glow { filter: drop-shadow(0 0 7px rgba(217, 181, 106, 0.55)); }
      .bar { position: relative; overflow: hidden; background: #05080f; border: 1px solid #000; }
      .bar > div { position: absolute; top: 0; bottom: 0; left: 0; }
      .bar .trail { background: #f4e6c8; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.35s; }
      .bar .fill { transition: width 0.14s ease-out; }
      .bar .fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 50%, rgba(0, 0, 0, 0.25)); }
      .bar .ticks { right: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0, 0, 0, 0.45) calc(10% - 1px) 10%); }
      .bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; text-shadow: 0 1px 0 #000, 0 0 3px #000; }
      .cta { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 32px; border: 0; cursor: pointer;
        font: 700 16px var(--ui); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: transform 0.15s cubic-bezier(0.3, 0.7, 0.4, 1), filter 0.2s;
        clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%); }
      .cta:hover { filter: brightness(1.15); }
      .cta:active { transform: scale(0.96); }
      .cta.gold { background: linear-gradient(180deg, #f6e2a6, #c79a45 55%, #8c6a2c); color: #1a1206; }
      .cta.gold::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 2.6s ease-in-out infinite; }
      .cta.ghost { background: #0e1626; color: var(--text); box-shadow: inset 0 0 0 1px var(--gold-dim); }
      .cta.off { background: #10141c; color: #6e7891; cursor: default; }
      .cta.off:hover { filter: none; }
      .breath { animation: breath 2.4s ease-in-out infinite; }
      .gem { width: 1em; height: 1em; flex: none; }

      /* ---------- in-run HUD ---------- */
      #hud { position: fixed; inset: 0; pointer-events: none; transition: opacity 0.6s; }
      #hud button { pointer-events: auto; }
      body.menus #hud, body.menus #touch { display: none; }
      body.cine #hud, body.cine #touch, body.cine #floaters { opacity: 0; transition: opacity 0.6s; }
      #hud-tl { position: fixed; left: 24px; top: 20px; display: flex; flex-direction: column; gap: 14px; }
      #kills-plate .in { display: flex; align-items: center; gap: 12px; padding: 9px 18px 9px 14px; }
      #kills-plate b { display: block; font-size: 26px; line-height: 1; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
      #kills-plate small { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; }
      #buffs { display: flex; gap: 10px; }
      .buff { position: relative; width: 44px; height: 44px; border-radius: 50%; padding: 3px; background: conic-gradient(var(--bc) calc(var(--p) * 1%), #1b2a44 0); }
      .buff > i { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #0a1120; }
      .buff svg { width: 22px; height: 22px; }
      .buff b { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font-size: 11px; padding: 0 4px; background: #05080f; color: var(--text); }
      #hud-top { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: min(560px, 46vw); display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #timer-plate .in { padding: 5px 32px 7px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
      #timer { font-size: 32px; font-weight: 700; letter-spacing: 0.06em; color: var(--gold-hi); font-variant-numeric: tabular-nums; margin-top: 3px; }
      #kills-touch { display: none; font-size: 11px; color: var(--muted); margin-top: 3px; }
      #horde { display: none; padding: 6px 24px; font-size: 17px; font-weight: 700; color: #ffd9d2; text-shadow: 0 1px 0 #000; animation: pulse 1s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, rgba(120, 18, 18, 0.85) 20%, rgba(120, 18, 18, 0.85) 80%, transparent); }
      #boss { display: none; width: 100%; }
      #boss .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; color: #e9d6ff; }
      #boss-name { font: 700 16px var(--display); letter-spacing: 0.08em; text-shadow: 0 0 10px rgba(176, 140, 255, 0.6), 0 1px 0 #000; }
      #boss .bar { height: 16px; border-color: #7a4fb8; animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.3, 1); }
      #boss-fill { background: linear-gradient(90deg, #6a2fb8, #b565ff); }
      #boss .ticks { background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), rgba(0, 0, 0, 0.7) calc(25% - 2px) 25%); }
      #hud-tr { position: fixed; right: 24px; top: 20px; display: flex; gap: 10px; }
      #auto, #pause-btn { height: 44px; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--gold-dim); cursor: pointer; font-size: 13px; }
      #auto { padding: 0 8px 0 14px; }
      #auto b { padding: 3px 9px; font-size: 11px; letter-spacing: 0.1em; background: #45d06f; color: #05080f; }
      #auto.off b { background: #ff8a7a; }
      #auto kbd, .kbd { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid var(--gold-dim); font: 700 11px var(--ui); color: var(--gold-hi); }
      #pause-btn { width: 44px; justify-content: center; }
      #lvl-toast { position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; text-align: center; }
      #lvl-toast.show { display: flex; animation: toast 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
      #lvl-toast small { font-size: 12px; letter-spacing: 0.3em; color: #c9a9ff; text-shadow: 0 1px 0 #000; }
      #lvl-toast b { font: 800 40px var(--display); color: var(--gold-hi); text-shadow: 0 0 18px rgba(246, 226, 166, 0.6), 0 2px 0 #000; }

      #bottom { --c: 14px; position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6)); pointer-events: auto; }
      #dock { display: grid; align-items: center; column-gap: 12px; row-gap: 6px; padding: 12px 18px 12px 14px;
        grid-template-columns: auto auto auto 1px auto 1px auto auto;
        grid-template-areas: 'st po ga s1 sk s2 fl iv' 'st po hp hp hp hp hp iv' 'st po mp mp mp mp mp iv'; }
      #stats { grid-area: st; display: grid; grid-template-columns: repeat(2, auto); column-gap: 14px; row-gap: 7px; padding-right: 14px; border-right: 1px solid var(--line); align-self: stretch; align-content: center; }
      .st { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
      .st i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--c); }
      .st span { color: var(--muted); min-width: 30px; }
      .st b { font-variant-numeric: tabular-nums; }
      #passive-text { grid-column: 1 / -1; font-size: 11px; color: #9fd8ff; }
      #passive-text:empty { display: none; }
      #portrait { grid-area: po; position: relative; width: 96px; height: 96px; }
      #portrait svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      #portrait circle { fill: none; stroke-width: 5; }
      #xp-ring { stroke: var(--xp); filter: drop-shadow(0 0 4px rgba(176, 140, 255, 0.8)); transition: stroke-dasharray 0.2s; }
      #portrait img { position: absolute; inset: 9px; width: calc(100% - 18px); height: calc(100% - 18px); border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
      #portrait .burst { position: absolute; inset: -14px; border-radius: 50%; border: 2px solid var(--gold-hi); opacity: 0; pointer-events: none; }
      #portrait.leveled .burst { animation: burst 1.1s cubic-bezier(0.2, 0.8, 0.3, 1); }
      #level { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); min-width: 30px; height: 24px; padding: 0 6px; display: grid; place-items: center; background: #05080f; border: 1px solid var(--gold); font-size: 14px; color: var(--gold-hi); }
      .sep { width: 1px; align-self: stretch; background: var(--line); }
      .sep.s1 { grid-area: s1; } .sep.s2 { grid-area: s2; }
      #skills { grid-area: sk; display: flex; gap: 10px; margin-bottom: 12px; }
      .skill { position: relative; width: var(--slot); height: var(--slot); flex: none; transition: transform 0.12s cubic-bezier(0.3, 0.7, 0.4, 1); }
      .skill .sf, .pslot { position: absolute; inset: 0; padding: 2px; background: linear-gradient(160deg, var(--gold-hi), var(--gold-dim) 50%, var(--gold));
        clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
      .skill img, .pslot img, .skill .sweep { display: block; width: 100%; height: 100%; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: filter 0.2s; }
      .skill .sweep { position: absolute; inset: 2px; width: auto; height: auto; background: conic-gradient(transparent calc(var(--p, 360) * 1deg), rgba(3, 6, 12, 0.8) 0); }
      .skill .sf::after { content: ''; position: absolute; inset: 2px; background: linear-gradient(115deg, transparent 38%, rgba(255, 240, 200, 0.5) 50%, transparent 62%); transform: translateX(-130%); opacity: 0; }
      .skill.ready { filter: drop-shadow(0 0 6px rgba(217, 181, 106, 0.55)); }
      .skill.ready .sf::after { opacity: 1; animation: shine 3.4s ease-in-out infinite; }
      .skill.pop { animation: pop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
      .skill .cd-text { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #fff; text-shadow: 0 0 4px #000, 0 2px 0 #000; pointer-events: none; }
      .skill .key { position: absolute; left: 6px; top: 3px; font-size: 11px; font-weight: 700; color: var(--gold-hi); text-shadow: 0 0 3px #000, 0 1px 0 #000; }
      .skill .cost { position: absolute; right: 5px; bottom: 3px; font-size: 10px; color: #9cc8ff; text-shadow: 0 0 3px #000, 0 1px 0 #000; }
      .skill .pips { position: absolute; left: 0; right: 0; bottom: -12px; display: flex; justify-content: center; gap: 3px; }
      .skill .pips i { width: 7px; height: 7px; transform: rotate(45deg); background: #1b2435; border: 1px solid #3a4660; }
      .skill .pips i.on { background: var(--gold); border-color: var(--gold-hi); box-shadow: 0 0 4px rgba(246, 226, 166, 0.7); }
      .skill.locked .sf { background: linear-gradient(160deg, #3a4660, #1b2435); }
      .skill.locked img { filter: grayscale(1) brightness(0.3); }
      .skill.nomana img { filter: saturate(0.4) brightness(0.55) sepia(0.3) hue-rotate(180deg); }
      .skill.blocked img { filter: grayscale(1) brightness(0.4); }
      .skill.cooling img { filter: grayscale(0.55) brightness(0.75); }
      .skill.empowered .sf { background: linear-gradient(160deg, #fff3c4, #ff9a2e 50%, #ffd257); }
      .skill.empowered { animation: emp 1.2s ease-in-out infinite; }
      .skill.empowered img { filter: sepia(0.6) saturate(2.4) hue-rotate(-20deg) brightness(1.1); }
      .pslot { position: relative; width: 48px; height: 48px; margin-bottom: 12px; }
      #gauge { grid-area: ga; }
      #gauge-fill { position: absolute; left: 2px; right: 2px; bottom: 2px; background: linear-gradient(0deg, rgba(212, 60, 79, 0.75), rgba(255, 210, 87, 0.45)); }
      #gauge-label { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #ffd257; text-shadow: 0 0 4px #000, 0 0 2px #000; }
      #gauge.ready { filter: drop-shadow(0 0 8px #ffd257); }
      #gauge.ready #gauge-label { color: #fff; text-shadow: 0 0 6px #ff3b3b, 0 0 2px #000; }
      #flash-slot { grid-area: fl; display: none; }
      #flash-slot span:not(.key) { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 0 3px #000; }
      #flash-slot.cooling img { filter: grayscale(1) brightness(0.4); }
      #flash-slot .key { position: absolute; left: 5px; top: 2px; font-size: 11px; color: var(--gold-hi); text-shadow: 0 0 3px #000; }
      #hp-bar { grid-area: hp; height: 22px; }
      #hp-bar span { font-size: 13px; }
      #hp-fill { background: linear-gradient(180deg, #5be584, #1e8a45); }
      #shield-fill { background: linear-gradient(180deg, #fff, #c9d3e0); transition: width 0.14s, left 0.14s; }
      #mana-bar { grid-area: mp; height: 13px; }
      #mana-bar span { font-size: 10px; }
      #mana-fill { background: linear-gradient(180deg, #6daaff, #2558b8); }
      #inventory { grid-area: iv; display: grid; grid-template-columns: repeat(3, 42px); gap: 5px; padding-left: 14px; border-left: 1px solid var(--line); align-self: stretch; align-content: center; }
      #inventory img, #inventory span { width: 42px; height: 42px; border: 1px solid var(--gold-dim); display: block; background: #070b14; }
      #inventory span { border-color: var(--line); }
      @media (max-width: 1240px) { :root { --slot: 56px; } #portrait { width: 84px; height: 84px; } #inventory { grid-template-columns: repeat(3, 36px); } #inventory img, #inventory span { width: 36px; height: 36px; } }
      @media (max-width: 1080px) {
        #stats { display: none; }
        #dock { grid-template-columns: auto auto 1px auto 1px auto auto; grid-template-areas: 'po ga s1 sk s2 fl iv' 'po hp hp hp hp hp iv' 'po mp mp mp mp mp iv'; }
        #hud-top { width: min(420px, 40vw); }
        #auto > span { display: none; }
      }

      /* floating combat text */
      #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .floater { position: absolute; left: 0; top: 0; font: 700 17px var(--ui); text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8); white-space: nowrap; }
      .floater.physical { color: #fff; }
      .floater.magic { color: #7dbbff; }
      .floater.crit { color: var(--crit); font-size: 24px; }
      .floater.taken { color: var(--danger); font-size: 19px; }
      .floater.xp { color: #c9a9ff; font-size: 13px; }

      /* ---------- overlays: level up, pause ---------- */
      .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(3, 6, 12, 0.8); }
      .overlay h2 { color: var(--gold-hi); margin: 0; font: 800 26px var(--display); letter-spacing: 0.04em; text-align: center; }
      /* level-up items: inventory strip, one card per offered base (its finished items + the plans it allows) */
      #levelup { overflow-y: auto; justify-content: flex-start; gap: 14px; padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom)); }
      #inv-edit { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      #inv-edit:empty { display: none; }
      #inv-edit .slot { position: relative; width: 56px; height: 56px; border: 1px solid var(--gold-dim); background: #070b14; transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1), box-shadow 0.25s; }
      #inv-edit .slot.empty { border: 1px dashed #2a3650; }
      #inv-edit .slot img { width: 100%; height: 100%; display: block; }
      #inv-edit .slot .prog { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 4px; background: rgba(0, 0, 0, 0.7); }
      #inv-edit .slot .prog i { display: block; height: 100%; background: linear-gradient(90deg, #c79a45, #f6e2a6); }
      #inv-edit .slot.target { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--gold-hi), 0 0 18px rgba(246, 226, 166, 0.6); }
      #inv-edit .slot.lockwarn { box-shadow: 0 0 0 2px var(--danger), 0 0 16px rgba(255, 90, 78, 0.6); animation: shake 0.45s ease; }
      #inv-edit .slot.burst { animation: unseal 1.2s cubic-bezier(0.2, 0.8, 0.3, 1); }
      #inv-edit .slot .ring { --tc: var(--gold-hi); border-radius: 0; }
      /* slot states: finished, locked (no evolution left), legendary (blueprint) */
      #inv-edit .final, #inventory .final { border-color: #ffd257; }
      #inv-edit .locked, #inventory .locked { border-color: #a33; filter: grayscale(0.8); }
      #inv-edit .legendary, #inventory .legendary { border-color: #ff9a2e; box-shadow: 0 0 8px #ff9a2e; }
      #offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 18px; width: min(1180px, 100%); align-items: start; }
      #offers:empty { display: none; }
      .ioffer { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px; background: linear-gradient(180deg, rgba(16, 24, 40, 0.96), rgba(6, 10, 18, 0.96)); box-shadow: inset 0 0 0 1px var(--gold-dim);
        animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) backwards; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.35s, box-shadow 0.3s; }
      .ioffer.best { box-shadow: inset 0 0 0 1px var(--gold-hi), inset 0 0 40px rgba(246, 226, 166, 0.08); }
      .ioffer.dismiss { opacity: 0; transform: translateY(24px) scale(0.95); pointer-events: none; }
      .ioffer.chosen { transform: scale(1.03); box-shadow: inset 0 0 0 2px var(--gold-hi), inset 0 0 60px rgba(246, 226, 166, 0.18); pointer-events: none; }
      .io-head { display: flex; align-items: center; gap: 14px; }
      .io-icon { position: relative; width: 64px; height: 64px; flex: none; padding: 2px; background: linear-gradient(160deg, var(--gold-hi), var(--gold-dim) 50%, var(--gold));
        clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
      .io-icon img { display: block; width: 100%; height: 100%; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
      .io-head b { display: block; font: 800 20px/1.15 var(--display); color: var(--gold-hi); }
      .io-head small { display: block; margin-top: 4px; font-size: 12px; color: #9fe3b0; }
      .io-label { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 96px; overflow-y: auto; margin-top: 6px; scrollbar-width: thin; }
      .ichip { position: relative; width: 42px; height: 42px; padding: 0; border: 1px solid var(--gold-dim); background: #070b14; cursor: pointer; flex: none; transition: transform 0.2s cubic-bezier(0.3, 1.5, 0.5, 1), border-color 0.2s; }
      .ichip img { display: block; width: 100%; height: 100%; }
      .ichip:hover, .ichip.on { transform: translateY(-3px); border-color: var(--gold-hi); }
      .ichip.on { box-shadow: 0 0 12px rgba(246, 226, 166, 0.5); }
      .ichip.taken img { filter: grayscale(1) brightness(0.4); }
      .ichip.mine { border-color: #4fdc7a; }
      .ichip i { position: absolute; right: -4px; top: -4px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font: 700 10px var(--ui); font-style: normal; }
      .ichip.mine i { background: #4fdc7a; color: #05080f; }
      .ichip.taken i { background: #3a1a1a; color: #ff8a7a; box-shadow: inset 0 0 0 1px #a33; }
      .ichip.hit { border-color: var(--gold-hi); box-shadow: 0 0 0 1px var(--gold-hi), 0 0 10px rgba(246, 226, 166, 0.45); }

      #joy-zone { position: fixed; left: 0; bottom: 0; width: 42vw; height: 60vh; }
      #joy { position: absolute; left: calc(100px + env(safe-area-inset-left)); top: calc(100% - 100px); width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 2px solid rgba(217, 181, 106, 0.45);
        background: radial-gradient(circle, rgba(10, 17, 32, 0.2), rgba(10, 17, 32, 0.6)); box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6); opacity: 0.55; pointer-events: none; transition: opacity 0.2s; }

      #touch-pause { position: fixed; top: max(10px, env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--gold-dim); }
      /* skills on an arc around the attack button (thumb reach), R farthest, Flash above */

      #touch-flash span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; text-shadow: 0 0 3px #000; }
      #aim { position: fixed; left: 0; top: 0; height: 6px; margin-top: -3px; transform-origin: 0 50%; background: linear-gradient(90deg, rgba(120, 200, 255, 0.1), rgba(120, 200, 255, 0.8)); border-radius: 3px; pointer-events: none; }

      /* ---------- motion ---------- */
      @keyframes sheen { 0%, 50% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

      @keyframes rise { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: none; } }
      @keyframes float { 0%, 100% { transform: translateY(0) scale(1.03); } 50% { transform: translateY(-10px) scale(1.03); } }
      @keyframes splash { 0% { opacity: 0; transform: scale(1.08) translateX(30px); } 100% { opacity: 1; transform: scale(1.03); } }
      @keyframes namein { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: none; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes ping { 0% { transform: scale(0.9); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
      @keyframes glint { 0%, 100% { box-shadow: 0 0 0 rgba(246, 226, 166, 0); } 50% { box-shadow: 0 0 10px rgba(246, 226, 166, 0.7); } }
      @keyframes unseal { 0% { transform: scale(1); } 8% { transform: translateX(-3px) rotate(-4deg); } 16% { transform: translateX(3px) rotate(4deg); } 24% { transform: translateX(-2px); } 30% { transform: scale(0.88); } 42% { transform: scale(1.32); } 62% { transform: scale(0.96); } 100% { transform: scale(1); } }

      @keyframes snap { 0% { transform: scale(0.8); } 55% { transform: scale(1.2); } 100% { transform: scale(1); } }
      @keyframes ring { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(2.3); opacity: 0; } }
      @keyframes shard { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-70px) scale(0.4); } }

      @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
      @keyframes minus { 0% { opacity: 0; transform: translateY(-20px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }
      @keyframes fadeout { to { opacity: 0; } }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes beat { 0%, 100% { opacity: 0.35; } 15% { opacity: 1; } 30% { opacity: 0.5; } 45% { opacity: 0.9; } }
      @keyframes rays { 0% { opacity: 0; transform: scale(0.3) rotate(0deg); } 30% { opacity: 1; } 100% { opacity: 1; transform: scale(1.4) rotate(40deg); } }
